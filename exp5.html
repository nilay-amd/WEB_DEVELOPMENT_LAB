<html>
<body>
<br>
<center>
<h2><font face="Georgia" color="#003366">Student Registration Form</font></h2>
<form action="" method="post">
<table border="1" cellpadding="8" cellspacing="0">
<tr>
<td><b>First Name:</b></td>
<td><input type="text" name="fname" size="30"></td>
</tr>
<tr>
<td><b>Last Name:</b></td>
<td><input type="text" name="lname" size="30"></td>
</tr>
<tr>
<td><b>Password:</b></td>
<td><input type="password" name="password" size="30"></td>
</tr>
<tr>
<td><b>E-mail ID:</b></td>
<td><input type="text" name="email" size="30"></td>
</tr>
<tr>
<td><b>Phone Number:</b></td>
<td><input type="text" name="phone" size="30"></td>
</tr>
<tr>
<td><b>Sex:</b></td>
<td>
<input type="radio" name="sex" value="male"> Male
<input type="radio" name="sex" value="female"> Female
<input type="radio" name="sex" value="other"> Other
</td>
</tr>
<tr>
<td><b>Date of Birth:</b></td>
<td>
Day:
<select name="day">
<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
<option>10</option><option>15</option><option>20</option><option>25</option><option>30</option>
</select>
Month:
<select name="month">
<option>Jan</option><option>Feb</option><option>Mar</option><option>Apr</option>
<option>May</option><option>Jun</option><option>Jul</option><option>Aug</option>
<option>Sep</option><option>Oct</option><option>Nov</option><option>Dec</option>
</select>
Year:
<select name="year">
<option>2002</option><option>2003</option><option>2004</option><option>2005</option><option>2006</option>
</select>
</td>
</tr>
<tr>
<td><b>Languages Known:</b></td>
<td>
<input type="checkbox" name="lang" value="English"> English
<input type="checkbox" name="lang" value="Hindi"> Hindi
<input type="checkbox" name="lang" value="Telugu"> Telugu
<input type="checkbox" name="lang" value="Tamil"> Tamil
</td>
</tr>
<tr>
<td><b>Address:</b></td>
<td><textarea name="address" rows="3" cols="30"></textarea></td>
</tr>
<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit Form">
&nbsp;&nbsp;&nbsp;&nbsp;
<input type="reset" value="Reset Fields">
</td>
</tr>
</table>
</form>
</center>
</body>
</html>
