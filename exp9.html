<html>
<head>
<title>Experiment 9 - CSS Background & Links</title>
<style>
/* Control background image repetition */
body {
    background-image: url('images/bg.jpg');
    background-repeat: no-repeat;
    font-family: Arial, sans-serif;
}

/* Define styles for links */
a:link {
    color: blue;
    text-decoration: none;
}
a:visited {
    color: purple;
}
a:hover {
    color: red;
    text-decoration: underline;
}
a:active {
    color: green;
}
</style>
</head>
<body>
<h2>CSS Background Repeat and Link Pseudo-Classes</h2>
<p>This webpage demonstrates controlling background image repetition and styling hyperlinks.</p>
<p>Hover over or click the links below to observe the style changes:</p>
<p><a href="https://www.google.com" target="_blank">Google Search Engine (Unvisited / Visited)</a></p>
<p><a href="exp3.html">View Book Catalogue (Hover & Active Demo)</a></p>
</body>
</html>
